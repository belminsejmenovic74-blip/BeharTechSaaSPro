# ─────────────────────────────────────────────────────────────────────────────
#  Netlify config — Behar Tech Pro
# ─────────────────────────────────────────────────────────────────────────────
#  Next.js est en mode `output: "export"` (cf. next.config.mjs) — donc on
#  publie le dossier statique `out/`. Le plugin @netlify/plugin-nextjs N'EST
#  PAS utilisé (il sert au mode SSR, pas à l'export statique).
# ─────────────────────────────────────────────────────────────────────────────

[build]
  command   = "npm run build"
  publish   = "out"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION  = "20"
  NPM_FLAGS     = "--legacy-peer-deps"
  # Évite l'optimisation Next images côté Netlify (déjà unoptimized dans next.config)
  NEXT_TELEMETRY_DISABLED = "1"

# ─── Redirections / Routing ──────────────────────────────────────────────────
# La route API Next /api/send-sms est désactivée en export statique : on la
# bascule vers la Netlify Function équivalente.
[[redirects]]
  from   = "/api/send-sms"
  to    = "/.netlify/functions/send-sms"
  status = 200
  force  = true

# Page de téléchargement desktop : pas de vrais installateurs publiés tant que
# `desktopReady = false`. On évite les 404 si on tape l'URL directe d'un
# fichier inexistant en redirigeant vers la page /telecharger/.
[[redirects]]
  from   = "/telecharger/Behar-Tech-Pro-Setup.exe"
  to    = "/telecharger/"
  status = 302

[[redirects]]
  from   = "/telecharger/Behar-Tech-Pro-Linux.deb"
  to    = "/telecharger/"
  status = 302

# Fallback SPA pour les routes dynamiques Next non générées statiquement :
# évite le 404 et laisse Next côté client gérer la navigation.
[[redirects]]
  from   = "/*"
  to    = "/index.html"
  status = 200

# ─── Headers — sécurité + cache ──────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options          = "SAMEORIGIN"
    X-Content-Type-Options   = "nosniff"
    Referrer-Policy          = "strict-origin-when-cross-origin"
    Permissions-Policy       = "camera=(), microphone=(), geolocation=()"

# Cache long pour les assets versionnés Next.js
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache court pour le HTML (on doit voir les nouveaux déploiements vite)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
