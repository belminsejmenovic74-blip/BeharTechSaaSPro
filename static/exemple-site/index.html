<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Atelier Démo — Exemple de site avec Widget Behar Tech Pro</title>
<meta name="description" content="Exemple de site pour atelier de réparation intégrant le Widget client Behar Tech Pro."/>
<meta name="robots" content="noindex, nofollow"/>
<meta property="og:title" content="Atelier Démo — Widget Behar Tech Pro"/>
<meta property="og:description" content="Démonstration du parcours de demande et de rendez-vous Behar Tech Pro."/>
<meta property="og:type" content="website"/>
<meta name="theme-color" content="#0E1C2B"/>
<link rel="stylesheet" href="site.css"/>
<style>
  html,body{margin:0;min-height:100%;background:#fff;}
  body{overflow-x:hidden;}
  .site-page{background:#fff;}
  .desktop-page{display:block;width:100%;margin:0;}
  .mobile-page{display:none;max-width:390px;margin:0 auto;}
  .mobile-page .bmc{min-height:100vh;}
  .bmc input::placeholder,.bmc textarea::placeholder{color:var(--slate-2);opacity:1;}
  .bmc input,.bmc textarea{appearance:none;-webkit-appearance:none;}
  @media (max-width:700px){
    html,body{background:#fff;}
    .desktop-page{display:none;}
    .mobile-page{display:block;max-width:none;box-shadow:none;}
  }
</style>
<script src="vendor/react.development.js"></script>
<script src="vendor/react-dom.development.js"></script>
<script src="vendor/babel.min.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="parts.jsx?v=26"></script>
<script type="text/babel" src="heroes.jsx?v=22"></script>
<script type="text/babel" src="accueil.jsx?v=25"></script>
<script type="text/babel" src="services.jsx?v=22"></script>
<script type="text/babel" src="microsoudure.jsx?v=22"></script>
<script type="text/babel" src="contactpro.jsx?v=26"></script>
<script type="text/babel" src="contact.jsx?v=26"></script>
<script type="text/babel" src="mobiles.jsx?v=26"></script>

<script type="text/babel" data-presets="react">
window.BEHAR_WIDGET_PUBLIC_ID = "demo";
function BMCSubmitForm(event){
  event.preventDefault();
  window.location.hash = "#/contact";
}
window.BMCSubmitForm = BMCSubmitForm;

function routeFromHash(){
  const hash = window.location.hash.replace(/^#\/?/, "");
  if (hash === "micro-soudure") return "micro-soudure";
  if (hash === "contact-pro") return "contact-pro";
  if (hash === "contact") return "contact";
  if (hash === "services" || hash.startsWith("services/")) return "services";
  return "accueil";
}

function App(){
  const [route,setRoute] = React.useState(routeFromHash());

  React.useEffect(() => {
    window.BMCSetRoute = (href) => {
      const next = href || "#/";
      if (window.location.hash === next) {
        setRoute(routeFromHash());
        window.scrollTo({top:0,behavior:"smooth"});
      } else {
        window.location.hash = next;
      }
    };
    const onHash = () => setRoute(routeFromHash());
    window.addEventListener("hashchange", onHash);
    return () => {
      window.removeEventListener("hashchange", onHash);
      delete window.BMCSetRoute;
    };
  }, []);

  React.useEffect(() => {
    const onClick = (event) => {
      const link = event.target.closest?.('a[href="#"]');
      if (!link) return;
      event.preventDefault();
      const text = (link.textContent || "").toLowerCase();
      if (text.includes("micro-soudure")) {
        window.location.hash = "#/micro-soudure";
      } else if (text.includes("pro") || text.includes("revendeur")) {
        window.location.hash = "#/contact-pro";
      } else {
        window.location.hash = "#/contact";
      }
    };
    document.addEventListener("click", onClick);
    return () => document.removeEventListener("click", onClick);
  }, []);

  React.useEffect(() => {
    requestAnimationFrame(() => {
      window.scrollTo({top:0,behavior:"smooth"});
    });
  }, [route]);

  const serviceFocus = window.location.hash.replace(/^#\/?services\/?/, "") || null;
  const pages = {
    "accueil": {desktop:<AccueilDesktop/>, mobile:<AccueilMobile/>},
    "services": {desktop:<ServicesDesktop focus={serviceFocus}/>, mobile:<ServicesMobile focus={serviceFocus}/>},
    "micro-soudure": {desktop:<MicroDesktop/>, mobile:<MicroMobile/>},
    "contact-pro": {desktop:<ContactProDesktop/>, mobile:<ContactProMobile/>},
    "contact": {desktop:<ContactDesktop/>, mobile:<ContactMobile/>}
  };
  const page = pages[route] || pages.accueil;

  return (
    <>
      <div className="site-page desktop-page">{page.desktop}</div>
      <div className="site-page mobile-page">{page.mobile}</div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
